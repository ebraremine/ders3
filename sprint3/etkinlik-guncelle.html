<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Güncelle</title>
    <!-- Kendi öğrenci numaranızla bağlı CSS dosyası -->
    <link rel="stylesheet" href="css/2311012011.css">
    <script type="module" src="js/event-form.js"></script>
</head>
<body>

    <header class="yesil-header">
        <h1>Etkinlik Güncelle</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a> | 
            <a href="etkinlikler.html">Tüm Etkinlikler</a> | 
            <a href="etkinlik-ekle.html">Etkinlik Ekle</a> |
        </nav>
    </header>

    <main class="icerik-alani">
  <h2>Etkinlik Güncelle</h2>

  <form id="etkinlik-formu" style="max-width: 500px; display: flex; flex-direction: column; gap: 15px;">
    
    <div class="form-grup" style="display: flex; flex-direction: column; gap: 5px;">
      <label for="title"><strong>Etkinlik adı *</strong></label>
      <input type="text" id="title" name="title" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div class="form-grup" style="display: flex; flex-direction: column; gap: 5px;">
      <label for="category"><strong>Kategori *</strong></label>
      <select id="category" name="category" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        <option value="">Seçiniz</option>
        <option value="Atölye">Atölye</option>
        <option value="Seminer">Seminer</option>
        <option value="Söyleşi">Söyleşi</option>
      </select>
    </div>

    <div class="form-grup" style="display: flex; flex-direction: column; gap: 5px;">
      <label for="date"><strong>Tarih *</strong></label>
      <input type="date" id="date" name="date" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div class="form-grup" style="display: flex; flex-direction: column; gap: 5px;">
      <label for="time"><strong>Saat *</strong></label>
      <input type="time" id="time" name="time" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div class="form-grup" style="display: flex; flex-direction: column; gap: 5px;">
      <label for="location"><strong>Yer / Mekan *</strong></label>
      <input type="text" id="location" name="location" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div class="form-grup" style="display: flex; flex-direction: column; gap: 5px;">
      <label for="capacity"><strong>Kontenjan</strong></label>
      <input type="number" id="capacity" name="capacity" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div class="form-grup" style="display: flex; flex-direction: column; gap: 5px;">
      <label for="description"><strong>Açıklama</strong></label>
      <textarea id="description" name="description" rows="4" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
    </div>

    <button type="submit" class="btn btn-ana" style="align-self: flex-start; padding: 10px 20px;">Güncelle</button>
  </form>

  <div id="form-sonuc"></div>
</main>




    <footer>
        <hr>
        <p>&copy; 2026 Etkinlik Portalı - Tüm hakları saklıdır.</p>
    </footer>

</body>
</html>
