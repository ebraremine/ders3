<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Güncelle</title>
    <!-- Kendi öğrenci numaranızla bağlı CSS dosyası -->
    <link rel="stylesheet" href="css/2311012011.css">
    <script type="module" src="js/event-form.js"></script>
</head>
<body>

    <header class="yesil-header">
        <h1>Etkinlik Güncelle</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a> | 
            <a href="etkinlikler.html">Tüm Etkinlikler</a> | 
            <a href="etkinlik-ekle.html">Etkinlik Ekle</a> |
        </nav>
    </header>

    <main class="icerik-alani">
        <form action="#" method="post" class="etkinlik-formu">
            
            <div class="form-grup">
                <label for="ad">Etkinlik adı</label>
                <input type="text" id="ad" name="ad" value="Kariyer Günleri 2026">
            </div>

            <div class="form-grup">
                <label for="kategori">Kategori</label>
                <select id="kategori" name="kategori">
                    <option value="Seminer" selected>Seminer</option>
                    <option value="Atölye">Atölye</option>
                    <option value="Söyleşi">Söyleşi</option>
                    <option value="Teknoloji">Teknoloji</option>
                </select>
            </div>

            <div class="form-grup">
                <label for="tarih">Tarih</label>
                <input type="text" id="tarih" name="tarih" value="12.10.2026">
            </div>

            <div class="form-grup">
                <label for="yer">Yer / Mekan</label>
                <input type="text" id="yer" name="yer" value="Teknoloji Merkezi Amfisi">
            </div>

            <div class="form-grup">
                <label for="aciklama">Açıklama</label>
                <textarea id="aciklama" name="aciklama" rows="3">Mezun söyleşileri ve şirket standları.</textarea>
            </div>

            <button type="submit" class="btn-yesil">Güncelle</button>

        </form>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 Etkinlik Portalı - Tüm hakları saklıdır.</p>
    </footer>

</body>
</html>
