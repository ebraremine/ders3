        <main class="icerik-alani">
  <h2>Tüm Etkinlikler</h2>

  <!-- 1. ÜST KISIM: Arama ve Kategori Kutusu (Yan Yana) -->
  <div class="filtre-kapsayici" style="background: #ffffff; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 20px; width: 100%; box-sizing: border-box;">
    <form id="filtre-formu" style="display: flex; gap: 20px; flex-wrap: wrap;" onsubmit="return false;">
      
      <!-- Etkinlik Ara -->
      <div style="flex: 2; min-width: 200px;">
        <label for="arama-input" style="display: block; font-weight: bold; margin-bottom: 8px;">Etkinlik ara</label>
        <input 
          type="search" 
          id="arama-input" 
          placeholder="Örn. atölye, kariyer" 
          style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;"
        />
      </div>

      <!-- Kategori -->
      <div style="flex: 1; min-width: 150px;">
        <label for="kategori-select" style="display: block; font-weight: bold; margin-bottom: 8px;">Kategori</label>
        <select id="kategori-select" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
          <option value="">Tümü</option>
          <option value="Atölye">Atölye</option>
          <option value="Seminer">Seminer</option>
          <option value="Söyleşi">Söyleşi</option>
        </select>
      </div>

    </form>
  </div>

  <!-- 2. ORTA KISIM: Kaç Etkinlik Bulunduğu Bilgisi -->
  <p id="sonuc-sayisi" style="color: #2e7d32; font-weight: bold; margin-bottom: 20px;">6 etkinlik listeleniyor.</p>

  <!-- 3. ALT KISIM: Kartların Yan Yana Dizildiği Izgara (Grid) -->
  <section id="etkinlik-listesi" class="etkinlik-listesi">
    <!-- Kartlar JS (event-list.js) tarafından buraya yüklenecek -->
  </section>
</main>
